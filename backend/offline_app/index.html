<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PetroChina GPP · Inventory (Offline)</title>
<script src="xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --border: #e3e6eb;
    --text: #1c2430;
    --muted: #667085;
    --primary: #c8102e;        /* PetroChina red */
    --primary-dark: #9c0c24;
    --primary-soft: #fdecef;
    --accent: #b8860b;
    --ok: #1a8a5a;
    --ok-soft: #e6f4ee;
    --warn: #b7791f;
    --warn-soft: #fbf3e2;
    --danger: #c0392b;
    --danger-soft: #fbeae8;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(16,24,40,.08), 0 1px 2px rgba(16,24,40,.04);
    --t1: #c0392b; --t1-soft:#fbeae8;
    --t2: #b7791f; --t2-soft:#fbf3e2;
    --t3: #667085; --t3-soft:#eef0f3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.45;
  }
  ::selection { background: var(--primary-soft); }
  /* Layout */
  .app { display: flex; min-height: 100vh; }
  .sidebar {
    width: 232px; background: #12161c; color: #cfd4dc; flex-shrink: 0;
    display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid #232a33; }
  .brand img { width: 34px; height: 34px; border-radius: 8px; background: #fff; object-fit: contain; }
  .brand b { color: #fff; font-size: 14px; display: block; line-height: 1.1; }
  .brand span { font-size: 11px; color: #8b93a1; }
  .nav { padding: 10px 8px; flex: 1; overflow-y: auto; }
  .nav button {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: transparent; border: 0; color: #cfd4dc; padding: 10px 12px; border-radius: 8px;
    cursor: pointer; font-size: 13.5px; margin-bottom: 2px; transition: background .15s, color .15s;
  }
  .nav button:hover { background: #1c222b; color: #fff; }
  .nav button.active { background: var(--primary); color: #fff; font-weight: 600; }
  .nav .ico { width: 18px; text-align: center; font-size: 15px; }
  .side-foot { padding: 12px 16px; border-top: 1px solid #232a33; font-size: 11px; color: #8b93a1; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { display:flex; align-items:center; justify-content:space-between; padding: 16px 26px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .topbar h1 { margin: 0; font-size: 19px; }
  .content { padding: 22px 26px; }
  /* Components */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card .hd { padding: 14px 16px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .card .bd { padding: 16px; }
  .grid { display: grid; gap: 16px; }
  .kpis { grid-template-columns: repeat(4, 1fr); }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
  .kpi .lbl { font-size: 11px; text-transform: uppercase; letter-spacing:.05em; color: var(--muted); }
  .kpi .val { font-size: 26px; font-weight: 700; margin-top: 4px; }
  .kpi .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .row { display:flex; gap: 10px; align-items:center; flex-wrap: wrap; }
  .spacer { flex: 1; }
  input, select, textarea {
    font: inherit; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: #fff; color: var(--text); outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  label { font-size: 12px; color: var(--muted); display:block; margin-bottom: 4px; font-weight: 500; }
  .field { margin-bottom: 12px; }
  .btn {
    display:inline-flex; align-items:center; gap:6px; border: 1px solid var(--border); background: #fff; color: var(--text);
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font: inherit; font-weight: 500; transition: background .15s, border-color .15s, opacity .15s;
  }
  .btn:hover { background: #f7f8fa; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-dark); }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn.ghost:hover { background: #f0f1f4; }
  .btn.sm { padding: 5px 10px; font-size: 12.5px; }
  .btn.danger { color: var(--danger); border-color: var(--danger-soft); }
  .btn.danger:hover { background: var(--danger-soft); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing:.04em; color: var(--muted); padding: 9px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 9px 10px; border-bottom: 1px solid var(--border); }
  tbody tr:nth-child(even) { background: #fafbfc; }
  tbody tr:hover { background: var(--primary-soft); }
  .tr-click { cursor: pointer; }
  .rt { text-align: right; }
  .mono { font-family: "Consolas", "Courier New", monospace; color: var(--primary); font-size: 12.5px; }
  .num { font-variant-numeric: tabular-nums; }
  .pill { display:inline-flex; align-items:center; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; }
  .s-below { color: var(--danger); background: var(--danger-soft); }
  .s-min { color: var(--warn); background: var(--warn-soft); }
  .s-ok { color: var(--ok); background: var(--ok-soft); }
  .s-above { color: #2d6cdf; background: #e9f0fc; }
  .crit { display:inline-flex; align-items:center; justify-content:center; width: 22px; height: 22px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }
  .crit.c1 { color: var(--t1); background: var(--t1-soft); }
  .crit.c2 { color: var(--t2); background: var(--t2-soft); }
  .crit.c3 { color: var(--t3); background: var(--t3-soft); }
  .muted { color: var(--muted); }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  .table-wrap { overflow-x: auto; }
  /* Modal */
  .overlay { position: fixed; inset: 0; background: rgba(16,24,40,.45); backdrop-filter: blur(2px); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .overlay.show { display: flex; }
  .modal { background: var(--surface); border-radius: 12px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  .modal .m-hd { padding: 16px 18px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 16px; display:flex; justify-content:space-between; align-items:center; }
  .modal .m-bd { padding: 18px; }
  .modal .m-ft { padding: 14px 18px; border-top: 1px solid var(--border); display:flex; justify-content:flex-end; gap: 10px; }
  .two { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .x { cursor:pointer; color: var(--muted); border:0; background:transparent; font-size: 20px; line-height:1; }
  /* Toast */
  #toasts { position: fixed; bottom: 20px; right: 20px; display:flex; flex-direction:column; gap:8px; z-index: 200; }
  .toast { background: #12161c; color:#fff; padding: 11px 16px; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.25); font-size: 13px; animation: slide .2s ease; max-width: 360px; }
  .toast.ok { border-left: 3px solid var(--ok); }
  .toast.err { border-left: 3px solid var(--danger); }
  @keyframes slide { from { transform: translateX(20px); opacity: 0; } }
  .stat-line { display:flex; justify-content:space-between; padding: 7px 0; border-bottom: 1px dashed var(--border); }
  .stat-line:last-child { border-bottom: 0; }
  .stat-line b { font-variant-numeric: tabular-nums; }
  .banner { background: var(--warn-soft); border: 1px solid #f0e0bd; color: #7a5b12; padding: 10px 14px; border-radius: 8px; font-size: 12.5px; margin-bottom: 16px; }
  .filters { display:flex; gap: 10px; align-items:center; flex-wrap: wrap; margin-bottom: 14px; }
  .filters input[type=text] { min-width: 240px; }
  .seg { display:inline-flex; border:1px solid var(--border); border-radius: 8px; overflow:hidden; }
  .seg button { border:0; background:#fff; padding: 7px 12px; cursor:pointer; font: inherit; color: var(--muted); }
  .seg button.active { background: var(--primary); color:#fff; }
  .pager { display:flex; gap: 8px; align-items:center; justify-content:flex-end; margin-top: 12px; }
  h3.sec { font-size: 13px; text-transform: uppercase; letter-spacing:.05em; color: var(--muted); margin: 0 0 10px; }
  a.dl { color: var(--primary); font-weight:600; text-decoration:none; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <img src="logo.png" alt="logo" onerror="this.style.display='none'" />
      <div><b>PetroChina GPP</b><span>Inventory · Offline</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">Offline Desktop Edition<br/>Data stored in this browser</div>
  </aside>
  <div class="main">
    <div class="topbar"><h1 id="pageTitle">Dashboard</h1><div class="row" id="topActions"></div></div>
    <div class="content" id="view"></div>
  </div>
</div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
