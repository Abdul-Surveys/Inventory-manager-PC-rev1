# PetroChina GPP Inventory - single-host self-contained stack.
# All services run on one server and restart automatically after reboot/crash.
# The database is only reachable on the internal network (never published).
name: gpp-inventory

services:
  mongo:
    image: mongo:${MONGO_IMAGE_TAG:-7.0}
    container_name: gpp-mongo
    restart: unless-stopped
    command: ["--bind_ip_all"]
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - mongo_data:/data/db
    networks: [internal]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    image: gpp-inventory-backend:${APP_VERSION:-1.0.0}
    container_name: gpp-backend
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-gpp_inventory}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      TZ: ${TZ:-UTC}
    depends_on:
      mongo:
        condition: service_healthy
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/api/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  web:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-}
    image: gpp-inventory-web:${APP_VERSION:-1.0.0}
    container_name: gpp-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    networks: [internal]

volumes:
  mongo_data:
    name: gpp_mongo_data

networks:
  internal:
    driver: bridge
